<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Shopping Cart | MyShop</title>


    <!-- Google Font -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">


    <!-- Font Awesome -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {
            font-family: "Poppins", sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #eef2ff,
                    #f8fafc
                );

            min-height: 100vh;

            color: #111827;

            padding: 20px;
        }


        a {
            text-decoration: none;
        }


        button,
        input {
            font-family: inherit;
        }


        /* =====================================
           NAVBAR
        ===================================== */

        .navbar {

            max-width: 1150px;

            margin: auto;

            min-height: 68px;

            padding: 0 22px;

            background: white;

            border-radius: 16px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            box-shadow:
                0 8px 30px
                rgba(0, 0, 0, 0.06);

        }


        .logo {

            color: #4f46e5;

            font-size: 25px;

            font-weight: 800;

        }


        .nav-right {

            display: flex;

            align-items: center;

            gap: 20px;

        }


        .back-link {

            color: #4f46e5;

            font-size: 13px;

            font-weight: 600;

        }


        .cart-icon {

            position: relative;

            color: #111827;

            font-size: 20px;

        }


        .cart-count {

            position: absolute;

            top: -10px;

            right: -12px;

            min-width: 19px;

            height: 19px;

            padding: 0 5px;

            border-radius: 20px;

            background: #ef4444;

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 10px;

            font-weight: 700;

        }


        /* =====================================
           MAIN
        ===================================== */

        .container {

            max-width: 1150px;

            margin: 35px auto;

        }


        .page-title {

            margin-bottom: 25px;

        }


        .page-title h1 {

            font-size: 30px;

            margin-bottom: 5px;

        }


        .page-title p {

            color: #64748b;

            font-size: 13px;

        }


        .cart-layout {

            display: grid;

            grid-template-columns:
                1.6fr 0.8fr;

            gap: 25px;

        }


        /* =====================================
           CART CARD
        ===================================== */

        .cart-card {

            background: white;

            border-radius: 20px;

            padding: 25px;

            box-shadow:
                0 12px 35px
                rgba(0, 0, 0, 0.07);

        }


        .cart-header {

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 15px;

            padding-bottom: 15px;

            border-bottom: 1px solid #eef2f7;

        }


        .cart-header h2 {

            font-size: 18px;

        }


        .clear-btn {

            border: none;

            background: transparent;

            color: #ef4444;

            font-size: 12px;

            font-weight: 600;

            cursor: pointer;

        }


        /* =====================================
           CART ITEM
        ===================================== */

        .cart-item {

            display: grid;

            grid-template-columns:
                90px 1fr auto;

            align-items: center;

            gap: 18px;

            padding: 18px 0;

            border-bottom: 1px solid #eef2f7;

        }


        .cart-item:last-child {

            border-bottom: none;

        }


        .item-image {

            width: 90px;

            height: 90px;

            border-radius: 13px;

            overflow: hidden;

            background: #f1f5f9;

        }


        .item-image img {

            width: 100%;

            height: 100%;

            object-fit: cover;

        }


        .item-details {

            min-width: 0;

        }


        .item-category {

            color: #6366f1;

            font-size: 10px;

            font-weight: 600;

            text-transform: uppercase;

        }


        .item-name {

            font-size: 16px;

            font-weight: 600;

            margin: 4px 0;

        }


        .item-price {

            color: #64748b;

            font-size: 12px;

        }


        /* =====================================
           QUANTITY
        ===================================== */

        .quantity-box {

            display: flex;

            align-items: center;

            gap: 8px;

            margin-top: 10px;

        }


        .qty-btn {

            width: 30px;

            height: 30px;

            border: 1px solid #dbe1ea;

            background: white;

            border-radius: 7px;

            cursor: pointer;

            font-size: 15px;

            color: #374151;

        }


        .qty-btn:hover {

            background: #eef2ff;

            color: #4f46e5;

            border-color: #c7d2fe;

        }


        .quantity {

            min-width: 25px;

            text-align: center;

            font-size: 13px;

            font-weight: 600;

        }


        /* =====================================
           ITEM TOTAL
        ===================================== */

        .item-right {

            text-align: right;

        }


        .item-total {

            font-size: 17px;

            font-weight: 700;

            margin-bottom: 10px;

        }


        .remove-btn {

            border: none;

            background: transparent;

            color: #ef4444;

            cursor: pointer;

            font-size: 11px;

        }


        .remove-btn:hover {

            text-decoration: underline;

        }


        /* =====================================
           SUMMARY
        ===================================== */

        .summary-card {

            background: white;

            border-radius: 20px;

            padding: 25px;

            box-shadow:
                0 12px 35px
                rgba(0, 0, 0, 0.07);

            height: fit-content;

            position: sticky;

            top: 20px;

        }


        .summary-card h2 {

            font-size: 19px;

            margin-bottom: 20px;

        }


        .summary-row {

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 11px 0;

            font-size: 13px;

        }


        .summary-row span:first-child {

            color: #64748b;

        }


        .summary-row span:last-child {

            font-weight: 600;

        }


        .total-row {

            border-top: 2px solid #e5e7eb;

            margin-top: 10px;

            padding-top: 18px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            font-size: 20px;

            font-weight: 700;

        }


        .total-price {

            color: #4f46e5;

        }


        .checkout-btn {

            width: 100%;

            border: none;

            background: #4f46e5;

            color: white;

            border-radius: 11px;

            padding: 14px;

            margin-top: 20px;

            cursor: pointer;

            font-size: 14px;

            font-weight: 700;

            transition: 0.3s;

        }


        .checkout-btn:hover {

            background: #4338ca;

            transform: translateY(-2px);

            box-shadow:
                0 10px 25px
                rgba(79, 70, 229, 0.25);

        }


        .continue-btn {

            display: block;

            width: 100%;

            text-align: center;

            border: 1px solid #dbe1ea;

            color: #374151;

            border-radius: 11px;

            padding: 12px;

            margin-top: 10px;

            font-size: 12px;

            font-weight: 600;

        }


        .continue-btn:hover {

            border-color: #4f46e5;

            color: #4f46e5;

        }


        .secure {

            text-align: center;

            color: #64748b;

            font-size: 10px;

            margin-top: 15px;

        }


        /* =====================================
           EMPTY CART
        ===================================== */

        .empty-cart {

            text-align: center;

            padding: 65px 20px;

        }


        .empty-icon {

            width: 80px;

            height: 80px;

            margin: 0 auto 18px;

            border-radius: 50%;

            background: #eef2ff;

            color: #4f46e5;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 30px;

        }


        .empty-cart h2 {

            font-size: 22px;

            margin-bottom: 8px;

        }


        .empty-cart p {

            color: #64748b;

            font-size: 13px;

        }


        .shop-btn {

            display: inline-block;

            margin-top: 20px;

            padding: 12px 22px;

            border-radius: 10px;

            background: #4f46e5;

            color: white;

            font-size: 13px;

            font-weight: 600;

        }


        /* =====================================
           MOBILE
        ===================================== */

        @media (max-width: 800px) {

            body {

                padding: 12px;

            }


            .cart-layout {

                grid-template-columns: 1fr;

            }


            .summary-card {

                position: static;

            }

        }


        @media (max-width: 550px) {

            .navbar {

                min-height: 58px;

                padding: 0 15px;

            }


            .logo {

                font-size: 21px;

            }


            .back-link {

                font-size: 11px;

            }


            .container {

                margin-top: 25px;

            }


            .page-title h1 {

                font-size: 25px;

            }


            .cart-card,

            .summary-card {

                padding: 18px;

                border-radius: 17px;

            }


            .cart-item {

                grid-template-columns:
                    65px 1fr;

                gap: 12px;

            }


            .item-image {

                width: 65px;

                height: 65px;

            }


            .item-right {

                grid-column: 2;

                text-align: left;

                display: flex;

                align-items: center;

                justify-content: space-between;

            }


            .item-total {

                margin-bottom: 0;

                font-size: 15px;

            }


            .item-name {

                font-size: 14px;

            }

        }


        @media (max-width: 380px) {

            .cart-header h2 {

                font-size: 16px;

            }


            .clear-btn {

                font-size: 10px;

            }


            .item-name {

                font-size: 13px;

            }

        }

    </style>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/cart.css">

</head>


<body>


    <!-- =====================================
         NAVBAR
    ===================================== -->

    <nav class="navbar">


        <a href="index.html"
           class="logo">

            MyShop

        </a>


        <div class="nav-right">


            <a href="products.html"
               class="back-link">

                ← Continue Shopping

            </a>


            <a href="cart.html"
               class="cart-icon">

                <i class="fa-solid fa-cart-shopping"></i>

                <span id="cartCount"
                      class="cart-count">

                    0

                </span>

            </a>


        </div>


    </nav>



    <!-- =====================================
         MAIN
    ===================================== -->

    <main class="container">


        <div class="page-title">

            <h1>
                Shopping Cart
            </h1>

            <p>
                Review your products before checkout.
            </p>

        </div>



        <div class="cart-layout">


            <!-- =================================
                 CART PRODUCTS
            ================================== -->

            <section class="cart-card">


                <div class="cart-header">

                    <h2>
                        Your Items
                    </h2>


                    <button
                        class="clear-btn"
                        onclick="clearCart()">

                        <i class="fa-solid fa-trash"></i>
                        Clear Cart

                    </button>

                </div>


                <div id="cartItems">

                    <!-- Items added by JavaScript -->

                </div>


            </section>



            <!-- =================================
                 ORDER SUMMARY
            ================================== -->

            <aside class="summary-card">


                <h2>
                    Order Summary
                </h2>


                <div class="summary-row">

                    <span>
                        Items
                    </span>

                    <span id="itemsCount">
                        0
                    </span>

                </div>


                <div class="summary-row">

                    <span>
                        Subtotal
                    </span>

                    <span id="subtotal">
                        ₹0
                    </span>

                </div>


                <div class="summary-row">

                    <span>
                        Delivery
                    </span>

                    <span id="delivery">
                        FREE
                    </span>

                </div>


                <div class="summary-row">

                    <span>
                        Discount
                    </span>

                    <span>
                        ₹0
                    </span>

                </div>


                <div class="total-row">

                    <span>
                        Total
                    </span>

                    <span
                        id="totalPrice"
                        class="total-price">

                        ₹0

                    </span>

                </div>


                <button
                    id="checkoutBtn"
                    class="checkout-btn"
                    onclick="goToCheckout()">

                    Proceed to Checkout
                    <i class="fa-solid fa-arrow-right"></i>

                </button>


                <a href="products.html"
                   class="continue-btn">

                    ← Continue Shopping

                </a>


                <div class="secure">

                    🔒 Secure checkout

                </div>


            </aside>


        </div>


    </main>



        <!-- =====================================
            JAVASCRIPT
        ===================================== -->

        <script src="js/script.js"></script>
        <script src="js/cart.js"></script>

        <script>


        /* =====================================
           LOAD CART
        ===================================== */

        let cart =
            JSON.parse(
                localStorage.getItem("cart")
            ) || [];



        /* =====================================
           DISPLAY CART
        ===================================== */

        function displayCart() {


            const cartContainer =
                document.getElementById(
                    "cartItems"
                );


            const checkoutBtn =
                document.getElementById(
                    "checkoutBtn"
                );


            if (cart.length === 0) {


                cartContainer.innerHTML = `

                    <div class="empty-cart">

                        <div class="empty-icon">

                            <i class="fa-solid fa-cart-shopping"></i>

                        </div>

                        <h2>
                            Your Cart is Empty
                        </h2>

                        <p>
                            Looks like you haven't added
                            anything to your cart yet.
                        </p>

                        <a
                            href="products.html"
                            class="shop-btn">

                            Start Shopping

                        </a>

                    </div>

                `;


                checkoutBtn.style.display =
                    "none";


                updateSummary();


                return;

            }


            checkoutBtn.style.display =
                "block";


            cartContainer.innerHTML = "";


            cart.forEach(
                (item, index) => {


                    const quantity =
                        Number(item.quantity) || 1;


                    const price =
                        Number(item.price) || 0;


                    const itemTotal =
                        price * quantity;


                    cartContainer.innerHTML += `

                        <div class="cart-item">


                            <div class="item-image">

                                <img
                                    src="${item.image || 'images/product1.jpg'}"
                                    alt="${item.name}">

                            </div>


                            <div class="item-details">


                                <span class="item-category">

                                    Product

                                </span>


                                <div class="item-name">

                                    ${item.name}

                                </div>

                                <span class="item-category">
                                    ${item.color ? `Colour: ${item.color}` : ""}${item.color && item.size ? " · " : ""}${item.size ? `Size: ${item.size}` : ""}
                                </span>


                                <div class="item-price">

                                    ₹${price.toLocaleString("en-IN")}
                                    each

                                </div>


                                <div class="quantity-box">


                                    <button
                                        class="qty-btn"
                                        onclick="changeQuantity(
                                            ${index},
                                            -1
                                        )">

                                        −

                                    </button>


                                    <span class="quantity">

                                        ${quantity}

                                    </span>


                                    <button
                                        class="qty-btn"
                                        onclick="changeQuantity(
                                            ${index},
                                            1
                                        )">

                                        +

                                    </button>


                                </div>


                            </div>


                            <div class="item-right">


                                <div class="item-total">

                                    ₹${itemTotal.toLocaleString("en-IN")}

                                </div>


                                <button
                                    class="remove-btn"
                                    onclick="removeItem(${index})">

                                    <i class="fa-solid fa-trash"></i>

                                    Remove

                                </button>


                            </div>


                        </div>

                    `;

                }
            );


            updateSummary();

        }



        /* =====================================
           CHANGE QUANTITY
        ===================================== */

        function changeQuantity(
            index,
            change
        ) {


            if (!cart[index]) {
                return;
            }


            cart[index].quantity =
                Number(cart[index].quantity) +
                change;


            if (cart[index].quantity <= 0) {

                cart.splice(index, 1);

            }


            saveCart();


            displayCart();

        }



        /* =====================================
           REMOVE ITEM
        ===================================== */

        function removeItem(index) {


            if (!cart[index]) {
                return;
            }


            const itemName =
                cart[index].name;


            const confirmRemove =
                confirm(
                    `Remove "${itemName}" from cart?`
                );


            if (!confirmRemove) {
                return;
            }


            cart.splice(index, 1);


            saveCart();


            displayCart();

        }



        /* =====================================
           CLEAR CART
        ===================================== */

        function clearCart() {


            if (cart.length === 0) {

                return;

            }


            const confirmClear =
                confirm(
                    "Are you sure you want to clear your cart?"
                );


            if (!confirmClear) {

                return;

            }


            cart = [];


            saveCart();


            displayCart();

        }



        /* =====================================
           SAVE CART
        ===================================== */

        function saveCart() {


            localStorage.setItem(
                "cart",
                JSON.stringify(cart)
            );

        }



        /* =====================================
           UPDATE SUMMARY
        ===================================== */

        function updateSummary() {


            let subtotal = 0;

            let totalItems = 0;


            cart.forEach(item => {


                const price =
                    Number(item.price) || 0;


                const quantity =
                    Number(item.quantity) || 1;


                subtotal +=
                    price * quantity;


                totalItems +=
                    quantity;

            });


            const delivery = 0;


            const total =
                subtotal + delivery;


            document.getElementById(
                "itemsCount"
            ).textContent =
                totalItems;


            document.getElementById(
                "cartCount"
            ).textContent =
                totalItems;


            document.getElementById(
                "subtotal"
            ).textContent =
                "₹" +
                subtotal.toLocaleString("en-IN");


            document.getElementById(
                "totalPrice"
            ).textContent =
                "₹" +
                total.toLocaleString("en-IN");


            /*
                Save total for checkout/payment
            */

            localStorage.setItem(
                "cartTotal",
                total
            );

        }



        /* =====================================
           GO TO CHECKOUT
        ===================================== */

        function goToCheckout() {


            if (cart.length === 0) {


                alert(
                    "Your cart is empty. Please add a product first."
                );


                return;

            }


            window.location.href =
                "checkout.html";

        }



        /* =====================================
           INITIAL LOAD
        ===================================== */

        displayCart();

    </script>


</body>

</html>
